<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-labelledby="t d">
<title id="t">How berth works</title>
<desc id="d">Clients ask berth for the GPU. Agents such as Hermes and ComfyUI workflows go through the berth gateway, one endpoint (and one per card) that starts engines on demand; engines under berth run, games, training runs under berth train and a VM passage (berth vfio run) ask directly. A training run locks its cards, and every other request there is refused at once. berthd queues them by priority, drains the holder at its boundary (saving KV caches or parking it in RAM), waits for the driver to show the memory free, then grants the lease. gpu0 serves strata while gpu1 is passed through to a VM. A timeline of one 24 GiB card shows llama-swap, strata, a game, a VM passage and ComfyUI taking turns with no overlap.</desc>
